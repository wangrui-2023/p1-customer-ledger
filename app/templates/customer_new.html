{% extends "base.html" %}

{% block title %}新增客户 · 客户台账{% endblock %}

{% block content %}
<h1>新增客户</h1>

{% if errors %}
<ul class="errors">
  {% for error in errors %}
  <li>{{ error }}</li>
  {% endfor %}
</ul>
{% endif %}

<form class="card form" method="post" action="/customers">
  <label>
    姓名 <span class="required">*</span>
    <input name="name" value="{{ form.name or '' }}" required>
  </label>
  <label>
    手机号
    <input name="phone" value="{{ form.phone or '' }}" inputmode="numeric">
  </label>
  <label>
    公司
    <input name="company" value="{{ form.company or '' }}">
  </label>
  <label>
    备注
    <textarea name="note" rows="3">{{ form.note or '' }}</textarea>
  </label>
  <div class="actions">
    <button type="submit">保存</button>
    <a class="link" href="/customers">取消</a>
  </div>
</form>
{% endblock %}
